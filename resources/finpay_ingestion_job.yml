# =============================================================
# finpay_ingestion_job.yml — Job 1: Pipeline ETL
# Orquesta la ejecución del pipeline DLT Bronze → Silver → Gold
# Tiene reintentos y alertas por fallo configurados
# =============================================================

resources:
  jobs:
    finpay_ingestion_job:
      name: finpay_ingestion_job_${bundle.target}

      max_concurrent_runs: 1

      tasks:
        - task_key: run_etl_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.finpay_etl_pipeline.id}
            full_refresh: false
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 60000

      email_notifications:
        on_failure:
          - 17100799@ue.edu.pe
        on_success:
          - 17100799@ue.edu.pe

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Lima"
        pause_status: ${var.pause_status}