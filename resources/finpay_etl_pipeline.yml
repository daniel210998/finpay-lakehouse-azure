# =============================================================
# finpay_etl_pipeline.yml — Lakeflow Declarative Pipeline
# Define el pipeline DLT que ejecuta Bronze → Silver → Gold
# Event logs persistidos en fintech_finpay.observability
# =============================================================

resources:
  pipelines:
    finpay_etl_pipeline:
      name: finpay_etl_pipeline_${bundle.target}

      catalog: ${var.catalog}
      schema: default

      event_log:
        name: finpay_event_log
        catalog: ${var.catalog}
        schema: observability

      libraries:
        - file:
            path: ../src/utils.py
        - file:
            path: ../src/bronze.py
        - file:
            path: ../src/silver.py
        - file:
            path: ../src/gold.py

      continuous: false

      # Serverless compute (requerido en workspace trial)
      serverless: true

      notifications:
        - email_recipients:
            - 17100799@ue.edu.pe
          alerts:
            - on-update-failure
            - on-update-fatal-failure