  <text x="865" y="347" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Tablas raw +</text>
  <text x="865" y="365" text-anchor="middle" font-size="11" fill="#78716C" font-family="Consolas, monospace">_source_name · _ingestion_time · _file_path</text>

