  <line x1="1135" y1="527" x2="1060" y2="527" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>
  <line x1="1135" y1="702" x2="1060" y2="702" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDash)"/>

