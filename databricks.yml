# =============================================================
# databricks.yml — Configuración raíz del Databricks Asset Bundle
# FinPay Lakehouse · Azure Databricks · Arquitectura Medallion
# =============================================================

bundle:
  name: finpay-lakehouse-azure

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  pause_status:
    description: The pause status for jobs
  warehouse_id:
    description: The SQL Warehouse ID for dashboards

targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-705cf5fe-d80f.cloud.databricks.com
    variables:
      catalog: fintech_finpay_dev
      schema: default
      pause_status: PAUSED
      warehouse_id: 3aabd4a7cb2f3361

  prod:
    mode: production
    workspace:
      host: https://dbc-705cf5fe-d80f.cloud.databricks.com
      root_path: /Workspace/Users/17100799@ue.edu.pe/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fintech_finpay
      schema: default
      pause_status: UNPAUSED
      warehouse_id: 3aabd4a7cb2f3361
    permissions:
      - user_name: 17100799@ue.edu.pe
        level: CAN_MANAGE